name: Sync meetup photos

on:
  schedule:
    # Drive cannot notify GitHub. Check four times a day and publish only when the album changed.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh photo list from Google Drive
        id: sync
        run: |
          python3 scripts/sync-drive-photos.py
          git add assets/data/photos.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No photo changes. Skipping deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update meetup photos from the shared Drive album"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Prepare site
        if: steps.sync.outputs.changed == 'true'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.changed == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.sync.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
